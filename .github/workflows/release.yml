name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble package
        run: |
          mkdir -p package/siku_voice
          cp -r client server shared config translations fxmanifest.lua README.md package/siku_voice/
          cd package
          zip -r ../siku_voice.zip siku_voice

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" siku_voice.zip --clobber
